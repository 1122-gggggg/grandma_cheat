[project]
name = "antiscam-guardian"
version = "0.1.0"
description = "阿嬤的台語反詐守門員 — 2026 全國 AI 專題創意競賽跨領域組 MVP"
readme = "README.md"
requires-python = ">=3.11"

# 正式依賴：筆電 CPU 可跑，禁中資模型
dependencies = [
  "faster-whisper>=1.0.0",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
]
[project.scripts]
demo = "antiscam.demo.runner:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antiscam"]

[tool.ruff]
target-version = "py311"

[tool.ty.environment]
python-version = "3.11"
